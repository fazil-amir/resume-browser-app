name: Build and Publish Docker Image

on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  IMAGE_NAME: fazilamir/resume-browser

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Calculate version
        id: version
        shell: bash
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version")

          if ! [[ "$BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid package.json version: $BASE_VERSION"
            exit 1
          fi

          MAJOR=$(echo "$BASE_VERSION" | cut -d. -f1)
          MINOR=$(echo "$BASE_VERSION" | cut -d. -f2)
          BASE_PATCH=$(echo "$BASE_VERSION" | cut -d. -f3)

          git fetch --tags --force

          LATEST_TAG=$(
            git tag -l "v${MAJOR}.${MINOR}.*" |
            sed 's/^v//' |
            sort -V |
            tail -n 1
          )

          if [ -z "$LATEST_TAG" ]; then
            # First image for this major/minor line.
            # If package.json is 1.0.0, first Docker image is 1.0.1.
            if [ "$BASE_PATCH" -eq 0 ]; then
              PATCH=1
            else
              PATCH=$BASE_PATCH
            fi

            VERSION="${MAJOR}.${MINOR}.${PATCH}"
          else
            LATEST_PATCH=$(echo "$LATEST_TAG" | cut -d. -f3)
            PATCH=$((LATEST_PATCH + 1))

            VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi

          echo "VERSION=$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}

      - name: Create Git tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag "v${VERSION}"
          git push origin "v${VERSION}"

      - name: Show published version
        run: |
          echo "Published:"
          echo "${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}"